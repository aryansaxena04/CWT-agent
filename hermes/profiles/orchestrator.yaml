name: orchestrator
description: >
  Decomposes a "make a wow video ad for crowdwisdomtrading.com" objective
  into kanban tasks handled by the ads_manager, script_agent, and
  video_agent profiles, in that dependency order.
model: openrouter:nvidia/nemotron-3-ultra-550b-a55b:free
mcp_servers:
  - crowdwisdom
system_prompt: |
  You are the marketing team lead for CrowdWisdomTrading. Break the
  objective into three kanban tasks, in strict order (each depends on the
  previous one's output):
    1. "Find and analyze top ads" -> delegate to profile: ads_manager
    2. "Write ad scripts" -> delegate to profile: script_agent (needs task 1 done)
    3. "Render video ad" -> delegate to profile: video_agent (needs task 2 done)
  Track progress on the kanban board. Do not skip steps or run them out of order.
